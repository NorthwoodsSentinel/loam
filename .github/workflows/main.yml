# CI for loam (NOR-388).
#
# Copied byte-for-byte from NorthwoodsSentinel/fleet-mcp origin/main f1bea96
# (blob 7932a098e637e270effd73a6bb05c2ce8b7a9108), which took it from WALL-E,
# which took its shape from the MCP Inspector's CI workflow (its
# .github/workflows/main.yml at commit d330df96): the same file name and
# workflow name, the same least-privilege `permissions`, one pinned runtime
# version stated once, and a `timeout-minutes` on the job. Then edited for
# loam; record: PROVENANCE-CHECK.md. Where this file differs, the reason is
# beside the line.
#
# One job runs every stage of `npm run local:gate`, the command a developer
# runs before pushing, except `local:dco`: `validate` (pin guard, the guards'
# own tests, format check, lint, typecheck and its coverage guard, Vitest
# tests, the dry-run build), then `coverage` (per-file coverage and its scope
# guard). The run line names the stages rather than `local:gate`, as WALL-E's
# and the Inspector's do; nothing checks that the two stay aligned, so edit
# them together. `local:dco` reads `origin/main`, which this shallow checkout
# does not have, so it stays local (the Inspector's reason, its
# docs/quality-gate.md:59); a pull request's commits are checked by
# .github/workflows/dco.yml instead. There is no `smoke` stage: loam is not an
# MCP server (README, "What's coming"), so the Inspector has nothing to drive.
# What each stage runs is in package.json.
#
# This workflow holds no secret and can write nothing. It deploys nothing:
# `build` is wrangler's `--dry-run` against a copy of wrangler.jsonc.template
# (no account, no credential), and deploying the Worker is the owner's act
# (AGENTS.md, Cloudflare work).
#
# Limits, accepted as in the sources: a pull request that edits this file, or
# the scripts it runs, is judged by the edited version (as in the Inspector;
# the control is review of the diff). The check is not REQUIRED for merging
# until the owner adds a repository ruleset; the job name `validate` below is
# the name that ruleset will match, so rename both together or not at all.

name: CI

on:
  # `pull_request`, not `pull_request_target`: the workflow runs from the pull
  # request's own revision with a read-only token and no secret.
  # No branch or path filter: a required check that a filter skips would stay
  # "expected" forever.
  pull_request:
  # The Inspector uses a bare `push:`. Here that would run every pull request
  # branch twice (once for the push, once for the pull request), so pushes are
  # limited to the branch pull requests merge into.
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN (the Inspector's block, verbatim). Without
# it the job would inherit the repository's default token permissions.
permissions:
  contents: read

env:
  # The one pinned runtime, stated once (the Inspector's pattern for its npm
  # pin). loam declares Node >= 22 (package.json `engines`, NOR-155). fleet-mcp
  # pins Bun here; loam's gate runs no Bun (the ingest scripts are run by hand
  # with Bun, but the gate only typechecks them), so Bun is not installed.
  CI_NODE_VERSION: "22.x"
  # `build` runs wrangler on every run; this documented system variable turns
  # its telemetry off (Cloudflare docs, "System environment variables" and
  # "Commands - General", read 2026-11-14).
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    # PROVISIONAL: no run of this workflow had been observed when it was
    # written. The rule is roughly twice the slowest observed run, rounded up
    # to the next five minutes, stated with the range it was read from. The
    # only measurement so far is local: the stages took under a minute on a
    # developer Mac once installed. 10 minutes is WALL-E's and fleet-mcp's
    # provisional value, a hung-job guard, not a flake remedy. Re-size it from
    # observed runs, with the range, once there are some. Vitest's per-test
    # budget (30 s, vitest.config.ts) is far smaller, so it fires first.
    timeout-minutes: 10

    steps:
      # Every action is pinned to a commit SHA with its exact release, in
      # every job of this repo; `npm run verify:action-pins` enforces it. Each
      # SHA and release below came from one tag lookup (2026-11-14).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in the checkout.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # No `cache: npm` (the Inspector has it): the install is small, and
          # a cache is one more thing that can differ between runs.

      - name: Install dependencies
        # From this repo's lockfile (package-lock.json, committed by NOR-155),
        # WALL-E's `npm ci`, and without running any dependency's install
        # script: nothing the gate runs needs one.
        run: npm ci --ignore-scripts

      - name: Run the gate (every stage of local:gate but the local-only local:dco)
        run: npm run validate && npm run coverage
