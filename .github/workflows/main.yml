# CI for fleet-mcp (NOR-355). Design: docs/DESIGN-nor-355-check.md, section 5.
#
# Copied from WALL-E's .github/workflows/main.yml (NorthwoodsSentinel/walle
# origin/main 5fb8747, blob cb0b5543) and edited for this repo. WALL-E took
# its shape from the MCP Inspector's CI workflow (its .github/workflows/main.yml
# at commit d330df96): the same file name and workflow name, the same
# least-privilege `permissions`, one pinned runtime version stated once, and a
# `timeout-minutes` on the job. Where this file differs, the reason is beside
# the line.
#
# One job runs every stage of `npm run local:gate`, the command a developer
# runs before pushing, except `local:dco`: `validate` (pin guard, skills
# guard (NOR-359), script tests, format check, lint, typecheck and its
# coverage guard, Vitest tests, the portable Bun tests with their skip
# report, the dry-run build), then
# `coverage` (per-file coverage of new TypeScript and its scope guard), then
# `smoke` (NOR-358: the pinned MCP Inspector over stdio and local HTTP). The
# run line names the stages rather than `local:gate`, as WALL-E's and the
# Inspector's do. `local:dco` (NOR-357) reads `origin/main`, which this
# shallow checkout does not have, so it stays local (the Inspector's reason,
# its docs/quality-gate.md:59); a pull request's commits are checked by
# .github/workflows/dco.yml instead. tools/attack-workflow.test.ts and
# tools/dco.attack.test.ts (case 31) pin this line as `local:gate` minus
# `local:dco`; edit them together. What each stage runs is in package.json
# and README.md.
#
# This workflow holds no secret and can write nothing. It deploys nothing:
# `build` is wrangler's `--dry-run`, and deploying the Worker is the owner's
# act (AGENTS.md, Cloudflare work).
#
# Limits, accepted in the design: a pull request that edits this file, or the
# scripts it runs, is judged by the edited version (as in the Inspector; the
# control is review of the diff). The check is not REQUIRED for merging until
# the repository ruleset of NOR-356 exists; the job name `validate` below is
# the name that ruleset will match, so rename both together or not at all.

name: CI

on:
  # `pull_request`, not `pull_request_target`: the workflow runs from the pull
  # request's own revision with a read-only token and no secret.
  # No branch or path filter: a required check that a filter skips would stay
  # "expected" forever.
  pull_request:
  # The Inspector uses a bare `push:`. Here that would run every pull request
  # branch twice (once for the push, once for the pull request), so pushes are
  # limited to the branch pull requests merge into.
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN (the Inspector's block, verbatim). Without
# it the job would inherit the repository's default token permissions.
permissions:
  contents: read

env:
  # The one pinned runtime, stated once (the Inspector's pattern for its npm
  # pin). 1.3.14 is this repo's `packageManager`; `@types/bun` in package.json
  # is pinned to the same number. Bump all three together.
  CI_BUN_VERSION: "1.3.14"
  # `build` runs wrangler on every run; this documented system variable turns
  # its telemetry off (Cloudflare docs, "System environment variables" and
  # "Commands - General", read 2026-11-14).
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    # PROVISIONAL: no run of this workflow had been observed when it was
    # written. The rule is roughly twice the slowest observed run, rounded up
    # to the next five minutes, stated with the range it was read from. The
    # only measurement so far is local: the stages took under a minute on a
    # developer Mac once installed. 10 minutes is WALL-E's provisional value, a
    # hung-job guard, not a flake remedy. Re-size it from observed runs, with
    # the range, once there are some. Vitest's per-test budget (30 s,
    # vitest.config.ts) and Bun's (5 s) are far smaller, so they fire first.
    # NOR-358: `smoke` (60 Inspector runs) took 42 s locally with the package
    # already in the npx cache; each run is killed at 60 s
    # (scripts/smoke-inspector.mjs). Not re-sized: no CI run observed yet.
    timeout-minutes: 10

    steps:
      # Every action is pinned to a commit SHA with its exact release, in
      # every job of this repo; `npm run verify:action-pins` enforces it. Each
      # SHA and release below came from one tag lookup (2026-11-14).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in the checkout.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          # No `cache: npm` (the Inspector has it): the install is small, and
          # a cache is one more thing that can differ between runs.

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.CI_BUN_VERSION }}

      - name: Install dependencies
        # From this repo's lockfile (bun.lock; there is no package-lock.json,
        # which is why this is not WALL-E's `npm ci`), and without running any
        # dependency's install script: nothing the gate runs needs one.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run the gate (every stage of local:gate but the local-only local:dco)
        # `smoke` (NOR-358) fetches the pinned Inspector with `npx` from the
        # public npm registry; it needs network access and no secret.
        run: npm run validate && npm run coverage && npm run smoke
